<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Game of Life - TEJ Academy</title>
  <link rel="stylesheet" href="main.css">
  <script src="GameOfLife.js" defer></script>
  <script src="main.js" defer></script>
</head>

<body>
  <div id="container">
    <h1>Game of Life</h1>
    <table id='board'></table>
    
    <div id='control_panel'>
      <button id='step_btn' class='button'>Step</button>
      <button id='play_btn' class='button'>Play</button>
      <button id='pause_btn' class='button'>Pause</button>
      <button id='random_btn' class='button'>Randomize</button>
      <button id='clear_btn' class='button'>Clear</button>
      <div class="speed-control">
        <label for="speed">Speed: </label>
        <input type="range" id="speed" min="50" max="1000" value="300"/>
      </div>
      <div>Generation: <span id="generation"> 0 </span></div>
    </div>
    
    <footer>
      <p>Built by [Sankar Bir Tamang] at <a href="http://www.tejcenter.org/">TEJ Academy</a></p>
    </footer>
  </div>
  
  
  
</body>
</html>
