<!DOCTYPE html>
<html>
  <head>
    <title>Pixel Art Creator</title>
    <!-- This gets us our fun 8-bit font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">

    <!-- loads our own CSS file -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Pixelate</h1>
    <div class="controls">
      <button id='add-row'>Add Row</button>
      <button id='add-col'>Add Column</button>
      <select id="color-picker">
        <option value="#ff0000">Red</option>
        <option value="#00ff00">Green</option>
        <option value="#0000ff">Blue</option>
        <option value="#ffff00">Yellow</option>
        <option value="#ff00ff">Magenta</option>
        <option value="#00ffff">Cyan</option>
        <option value="#000000">Black</option>
        <option value="#ffffff" selected>White (Eraser)</option>
      </select>
      <button id='clear-all'>Clear Canvas</button>
    </div>
    <div class="instructions">
      <h3>How to use:</h3>
      <p>1. Add rows and columns to create your canvas</p>
      <p>2. Select a color from the dropdown</p>
      <p>3. Click or drag to paint pixels</p>
      <p>4. Select white to erase pixels</p>
      <p>5. Use "Clear Canvas" to start over</p>
    </div>
    <table id="pixel-canvas"></table>
  </body>
  <!-- loads our JavaScript file -->
  <script type="text/javascript" src="/script.js"></script>
</html>
